<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui,sans-serif; color: var(--text-primary, CanvasText); }
  #cli-maintenance { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  h2 { font: inherit; font-weight: 600; margin: 0; }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--border-default, GrayText); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--surface-chip, ButtonFace); }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 2px solid var(--focus-ring, Highlight); outline-offset: 2px; }
  p { margin: 12px 0 0; }
  #message, dl { color: var(--text-secondary, CanvasText); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  .harness-usage { margin-top: 18px; border-top: 1px solid var(--border-default, GrayText); padding-top: 12px; }
  .harness-usage h2 { margin: 0; font: inherit; font-weight: 600; }
  .harness-usage dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 12px; margin: 10px 0; }
  .harness-usage dl[hidden] { display: none; }
  .harness-usage dt, .harness-usage dd { margin: 0; overflow-wrap: anywhere; }
  .harness-usage dd { text-align: end; font-variant-numeric: tabular-nums; }
  .harness-usage small { display: block; margin-top: 6px; color: var(--text-secondary, GrayText); }
</style>
</head>
<body>
<header><h2>ZCode</h2><button type="button" id="check">Check again</button></header>
<p id="state" role="status" aria-live="polite"></p>
<p id="message" hidden></p>
<dl id="details" hidden>
  <dt id="version-label"></dt><dd id="version"></dd>
  <dt id="path-label"></dt><dd id="path"></dd>
  <dt id="count-label"></dt><dd id="count"></dd>
</dl>
  <div id="cli-maintenance" class="actions" hidden>
    <button type="button" id="cli-action"></button>
    <span id="cli-status" role="status" aria-live="polite"></span>
  </div>
  <p id="cli-source"></p>
<section class="harness-usage" id="harness-usage" data-channel="cindy-zcode-status" data-recheck="check" aria-labelledby="harness-usage-title">
  <h2 id="harness-usage-title"></h2><dl hidden></dl><small role="status"></small>
</section>
<script src="usage-view.js"></script>
<script src="cli-settings.js"></script>
<script src="settings.js"></script>
</body>
</html>
