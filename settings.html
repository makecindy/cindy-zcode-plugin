<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui,sans-serif; color: var(--text-primary, CanvasText); }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  h2 { font: inherit; font-weight: 600; margin: 0; }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--border-default, GrayText); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--surface-chip, ButtonFace); }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 2px solid var(--focus-ring, Highlight); outline-offset: 2px; }
  p { margin: 12px 0 0; }
  #message, dl { color: var(--text-secondary, CanvasText); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  .harness-usage { margin-top: 18px; border-top: 1px solid var(--border-default, GrayText); padding-top: 12px; }
  .harness-usage h2 { margin: 0; font: inherit; font-weight: 600; }
  .harness-usage dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 12px; margin: 10px 0; }
  .harness-usage dl[hidden] { display: none; }
  .harness-usage dt, .harness-usage dd { margin: 0; overflow-wrap: anywhere; }
  .harness-usage dd { text-align: end; font-variant-numeric: tabular-nums; }
  .harness-usage small { display: block; margin-top: 6px; color: var(--text-secondary, GrayText); }
  .cli-version-label { display: flex; align-items: center; align-self: start; min-height: 32px; }
  dd.cli-version { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  button.cli-refresh { display: inline-grid; place-items: center; padding: 0; width: 32px; height: 32px; border: 0; border-radius: 999px; }
  #cli-maintenance { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #cli-status { color: var(--text-secondary, GrayText); }
  .account { margin: 16px 0 0; padding: 12px; border: 1px solid var(--border-default, GrayText); border-radius: 12px; }
  .account-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
  .account-title { font-weight: 600; }
  .account-status { color: var(--text-secondary, GrayText); text-align: end; overflow-wrap: anywhere; }
  .account-status[data-tone="success"] { color: var(--status-success, #2f7d4f); }
  .account-status[data-tone="warning"] { color: var(--warning-fg, #b54708); }
  .account p { margin: 8px 0 0; }
  .account-help { color: var(--text-secondary, GrayText); font-size: 13px; }
  .account-note[data-tone="error"] { color: var(--error-fg, #b42318); }
  .account a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .account-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .account button { min-height: 32px; }
  button.danger { color: var(--error-fg, #b42318); }
</style>
</head>
<body>
<header><h2>ZCode</h2></header>
<p id="state" role="status" aria-live="polite"></p>
<p id="message" hidden></p>
<dl>
  <dt id="version-label" class="cli-version-label"></dt><dd class="cli-version">
      <span id="version"></span>
      <button type="button" id="check" class="cli-refresh" disabled aria-label="Check CLI version and updates">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3a7 7 0 0 0 11.6-1"/></svg>
      </button>
      <div id="cli-maintenance" hidden>
        <button type="button" id="cli-action"></button>
        <span id="cli-status" role="status" aria-live="polite"></span>
      </div>
    </dd>
  <dt id="path-label"></dt><dd id="path"></dd>
  <dt id="count-label"></dt><dd id="count"></dd>
</dl>
<section class="account" id="account" aria-labelledby="account-title" hidden>
  <div class="account-head">
    <span class="account-title" id="account-title"></span>
    <span class="account-status" id="account-status" role="status" aria-live="polite"></span>
  </div>
  <p id="account-plan" hidden></p>
  <p class="account-help" id="account-help" hidden></p>
  <div class="account-actions" id="account-actions" hidden></div>
  <div id="account-confirm" hidden>
    <p id="account-confirm-text"></p>
    <div class="account-actions">
      <button type="button" class="danger" id="account-confirm-yes"></button>
      <button type="button" id="account-confirm-no"></button>
    </div>
  </div>
  <p class="account-note" id="account-note" role="status" aria-live="polite" hidden></p>
</section>
  <p id="cli-source"></p>
<section class="harness-usage" id="harness-usage" data-channel="cindy-zcode-status" data-recheck="check" aria-labelledby="harness-usage-title">
  <h2 id="harness-usage-title"></h2><dl hidden></dl><small role="status"></small>
</section>
<script src="usage-view.js"></script>
<script src="cli-settings.js"></script>
<script src="settings.js"></script>
<script src="account-view.js"></script>
</body>
</html>
